[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torch-compile-normal-dtype-promotion-guard"
version = "0.1.0"
description = "Guards a real torch.compile correctness bug: torch.distributions.Normal.sample() silently promotes the output dtype under torch.compile in cases where eager mode preserves loc's lower-precision dtype (pytorch/pytorch#194547), which can silently break fp16/bf16-sized buffer and memory-budget assumptions downstream"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "zhuhroscar-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
torch = ["torch>=2.0"]

[project.urls]
Homepage = "https://github.com/zhuhroscar-tech/torch-compile-normal-dtype-promotion-guard"

[project.scripts]
torch-compile-normal-dtype-promotion-guard = "torch_compile_normal_dtype_promotion_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
